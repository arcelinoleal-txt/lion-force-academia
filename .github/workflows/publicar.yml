name: Publicar site na Cloudflare

# Dispara a cada publicacao no main, inclusive quando o painel admin grava no GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

# Nao deixa duas publicacoes ao mesmo tempo
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publicar:
    name: Publicar na Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar o Wrangler
        run: npm install -g wrangler@4

      - name: Conferir o que sera publicado
        run: |
          echo "arquivos no repositorio:"
          git ls-files | wc -l
          echo ""
          echo "proibidos de publicar (tem que estar vazio):"
          git ls-files | grep -Ei 'PAINEL-GUIA|CLOUDFLARE-PASSO|tools/|\.mp4' || echo "  nenhum"

      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c69077e3ed99d5d0b6f638cb9f5024fe
        run: wrangler deploy

      - name: Conferir se subiu
        env:
          SITE: https://lionforceacademia.arcelinoleal.workers.dev
        run: |
          sleep 20
          echo "espera a Cloudflare propagar..."
          for i in 1 2 3 4 5 6; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$SITE/")
            echo "tentativa $i: $code"
            if [ "$code" = "200" ]; then
              echo "no ar: $SITE"
              break
            fi
            sleep 10
          done
          if [ "$code" != "200" ]; then
            echo "FALHOU: o site nao respondeu depois das tentativas"
            exit 1
          fi

      - name: Conferir as paginas principais
        env:
          SITE: https://lionforceacademia.arcelinoleal.workers.dev
        run: |
          falha=0
          for p in index.html equipe.html jardim-das-fontes.html historia.html contato.html styles.css cms.js admin/index.html; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$SITE/$p")
            echo "$p -> $code"
            [ "$code" = "200" ] || falha=1
          done
          echo ""
          echo "conferindo que os arquivos com senha NAO estao publicos:"
          for s in PAINEL-GUIA.md CLOUDFLARE-PASSO-A-PASSO.md wrangler.jsonc; do
            code=$(curl -sL -o /dev/null -w "%{http_code}" "$SITE/$s")
            if [ "$code" = "200" ]; then
              echo "  !!! $s ESTA PUBLICO (problema)"
              falha=1
            else
              echo "  $s bloqueado ($code)"
            fi
          done
          exit $falha
