<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lion Force — Story 1 · Lançamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="brand.css">
<style>
    html, body { width: 1080px; height: 1920px; }
    .art { height: 1920px; padding: 150px 90px 0; }
    .topbar { padding-bottom: 40px; }
    .brand { gap: 22px; }
    .brand img { height: 168px; }
    .brand-name { font-size: 26px; padding-left: 22px; }
    .brand-name small { font-size: 18px; }
    .handle { font-size: 25px; padding: 16px 30px; }
    .body { justify-content: center; gap: 52px; padding-top: 0; }
    .selo { font-size: 30px; padding: 20px 38px; letter-spacing: .18em; }
    h1 { font-size: 168px; }
    .lead { font-size: 40px; max-width: 900px; }
    .lion-mark { width: 900px; right: -110px; bottom: 60px; opacity: .16; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stat { padding: 40px 34px; }
    .stat strong { font-size: 84px; }
    .stat span { font-size: 22px; }
    .foot { padding: 40px 0 46px; font-size: 27px; }
    .swipe {
        display: flex;
        align-items: center;
        gap: 18px;
        align-self: flex-start;
        background: #fff;
        color: #0a0a0b;
        border-radius: 999px;
        padding: 26px 44px;
        font: 700 30px/1 var(--body);
        text-transform: uppercase;
        letter-spacing: .08em;
    }
    .up { font-size: 34px; }
</style>
</head>
<body>
<div class="art">
    <img class="lion-mark" src="assets/leao-mascote.png" alt="">

    <div class="topbar">
        <div class="brand">
            <img src="assets/logo-lion-force.png" alt="Lion Force">
            <span class="brand-name">Academia<small>Jardim Das Fontes</small></span>
        </div>
        <span class="handle">@<b>lionforce</b>_academia</span>
    </div>

    <div class="body">
        <span class="selo"><i class="dot"></i> Lançamento · Site novo</span>
        <h1>Agora a Lion<br>Force tem um<br><span class="red">site.</span></h1>
        <p class="lead">Estrutura, planos, treino no app e horários <b>tudo em um só lugar</b>.</p>
        <span class="swipe"><span class="up">&uarr;</span> Link na bio</span>
    </div>

    <div class="stats">
        <div class="stat"><strong>1.200m&sup2;</strong><span>de estrutura</span></div>
        <div class="stat"><strong>4.9</strong><span>nota no Google</span></div>
        <div class="stat"><strong>79,99</strong><span>plano anual</span></div>
        <div class="stat"><strong>06&mdash;22h</strong><span>seg a sex</span></div>
    </div>

    <div class="foot">
        <span>Jardim Das Fontes &middot; SP</span>
        <span class="url">link na <b>bio</b></span>
    </div>
</div>
</body>
</html>
